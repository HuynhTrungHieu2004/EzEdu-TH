<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống Sinh câu hỏi Đánh giá Năng lực tự động</title>
    <!-- Theme anti-flash: read preference before React mounts to prevent flash -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('theme-preference') || 'system';
          var resolved = pref === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : pref;
          document.documentElement.dataset.theme = resolved;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <!-- Crystal Background Elements -->
    <div class="crystal-background">
      <div class="crystal-shard shard-1"></div>
      <div class="crystal-shard shard-2"></div>
      <div class="crystal-shard shard-3"></div>
      <div class="crystal-shard shard-4"></div>
      <div class="crystal-shard shard-5"></div>
      <div class="crystal-shard shard-6"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
