<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EzEdu AI | Xử lý học liệu thành đề kiểm tra</title>
    <meta name="description" content="EzEdu AI giúp trích xuất, phân tích và chuyển đổi học liệu điện tử thành câu hỏi, đáp án và đề kiểm tra trong một quy trình dễ sử dụng." />
    <meta property="og:title" content="EzEdu AI | Xử lý học liệu thành đề kiểm tra" />
    <meta property="og:description" content="EzEdu AI giúp trích xuất, phân tích và chuyển đổi học liệu điện tử thành câu hỏi, đáp án và đề kiểm tra trong một quy trình dễ sử dụng." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#6c47ff" />
    <!-- Theme anti-flash: read preference before React mounts to prevent flash -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('theme-preference') || 'system';
          var resolved = pref === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : pref;
          document.documentElement.dataset.theme = resolved;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <!-- Crystal Background Elements -->
    <div class="crystal-background">
      <div class="crystal-shard shard-1"></div>
      <div class="crystal-shard shard-2"></div>
      <div class="crystal-shard shard-3"></div>
      <div class="crystal-shard shard-4"></div>
      <div class="crystal-shard shard-5"></div>
      <div class="crystal-shard shard-6"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
