<rect width="100%" height="100%" fill="#F4F7FB"/>
<text x="80" y="82" text-anchor="start" font-size="44" font-weight="700" fill="#163B65"><tspan x="80" dy="0">SEQUENCE DIAGRAM – HỎI ĐÁP RAG THEO TÀI LIỆU</tspan></text><text x="80" y="122" text-anchor="start" font-size="21" font-weight="400" fill="#526173"><tspan x="80" dy="0">Luồng chính, nhánh lỗi và cơ chế provider dự phòng</tspan></text><line x1="80" y1="150" x2="2770" y2="150" stroke="#2E74B5" stroke-width="4"/><rect x="20" y="220" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#1F7A5C" stroke-width="3"/><text x="170" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#1F7A5C"><tspan x="170" dy="0">Người học</tspan></text><line x1="170" y1="296" x2="170" y2="1760" stroke="#B4C4D3" stroke-width="2" stroke-dasharray="9 9"/><rect x="430" y="220" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#2E74B5" stroke-width="3"/><text x="580" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#2E74B5"><tspan x="580" dy="0">React UI</tspan></text><line x1="580" y1="296" x2="580" y2="1760" stroke="#B4C4D3" stroke-width="2" stroke-dasharray="9 9"/><rect x="840" y="220" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#163B65" stroke-width="3"/><text x="990" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#163B65"><tspan x="990" dy="0">Auth / Chat API</tspan></text><line x1="990" y1="296" x2="990" y2="1760" stroke="#B4C4D3" stroke-width="2" stroke-dasharray="9 9"/><rect x="1250" y="220" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#1F7A5C" stroke-width="3"/><text x="1400" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#1F7A5C"><tspan x="1400" dy="0">MongoDB</tspan></text><line x1="1400" y1="296" x2="1400" y2="1760" stroke="#B4C4D3" stroke-width="2" stroke-dasharray="9 9"/><rect x="1660" y="220" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#6B4AA5" stroke-width="3"/><text x="1810" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#6B4AA5"><tspan x="1810" dy="0">RAG Service</tspan></text><line x1="1810" y1="296" x2="1810" y2="1760" stroke="#B4C4D3" stroke-width="2" stroke-dasharray="9 9"/><rect x="2070" y="220" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#1F7A5C" stroke-width="3"/><text x="2220" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#1F7A5C"><tspan x="2220" dy="0">ChromaDB</tspan></text><line x1="2220" y1="296" x2="2220" y2="1760" stroke="#B4C4D3" stroke-width="2" stroke-dasharray="9 9"/><rect x="2480" y="220" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#B7791F" stroke-width="3"/><text x="2630" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#B7791F"><tspan x="2630" dy="0">Gemini / Groq</tspan></text><line x1="2630" y1="296" x2="2630" y2="1760" stroke="#B4C4D3" stroke-width="2" stroke-dasharray="9 9"/><line x1="170" y1="360" x2="580" y2="360" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrow)"/><text x="375" y="348" text-anchor="middle" font-size="18" font-weight="600" fill="#2E74B5"><tspan x="375" dy="0">1. Nhập câu hỏi, chọn tài liệu</tspan></text><line x1="580" y1="445" x2="990" y2="445" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrow)"/><text x="785" y="433" text-anchor="middle" font-size="18" font-weight="600" fill="#2E74B5"><tspan x="785" dy="0">2. POST /chat + JWT + documentIds</tspan></text><rect x="850" y="480" width="280" height="92" rx="8" fill="#DCEAF7" stroke="#2E74B5" stroke-width="2"/><text x="990" y="515" text-anchor="middle" font-size="18" font-weight="700" fill="#182230"><tspan x="990" dy="0">Xác thực JWT, quyền</tspan></text><text x="990" y="543" text-anchor="middle" font-size="18" font-weight="700" fill="#182230"><tspan x="990" dy="0">và rate limit</tspan></text><rect x="420" y="610" width="2220" height="940" rx="10" fill="none" stroke="#B7791F" stroke-width="3"/><rect x="420" y="610" width="470" height="50" rx="5" fill="#FFF3D6" stroke="#B7791F" stroke-width="2"/><text x="445" y="643" text-anchor="start" font-size="20" font-weight="700" fill="#B7791F"><tspan x="445" dy="0">ALT – kiểm tra yêu cầu</tspan></text><text x="445" y="695" text-anchor="start" font-size="18" font-weight="700" fill="#B42318"><tspan x="445" dy="0">[không hợp lệ]</tspan></text><line x1="990" y1="745" x2="580" y2="745" stroke="#B42318" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/><text x="785" y="733" text-anchor="middle" font-size="18" font-weight="600" fill="#B42318"><tspan x="785" dy="0">3. 400 / 401 / 403 / 429</tspan></text><line x1="580" y1="825" x2="170" y2="825" stroke="#B42318" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/><text x="375" y="813" text-anchor="middle" font-size="18" font-weight="600" fill="#B42318"><tspan x="375" dy="0">4. Hiển thị thông báo phù hợp</tspan></text><line x1="420" y1="870" x2="2640" y2="870" stroke="#B7791F" stroke-width="2"/><text x="445" y="910" text-anchor="start" font-size="18" font-weight="700" fill="#1F7A5C"><tspan x="445" dy="0">[hợp lệ]</tspan></text><line x1="990" y1="940" x2="1400" y2="940" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrow)"/><text x="1195" y="928" text-anchor="middle" font-size="18" font-weight="600" fill="#2E74B5"><tspan x="1195" dy="0">5. Tạo hoặc đọc conversation</tspan></text><line x1="990" y1="1020" x2="1810" y2="1020" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrow)"/><text x="1400" y="1008" text-anchor="middle" font-size="18" font-weight="600" fill="#2E74B5"><tspan x="1400" dy="0">6. answer(question, contextScope)</tspan></text><line x1="1810" y1="1100" x2="2220" y2="1100" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrow)"/><text x="2015" y="1088" text-anchor="middle" font-size="18" font-weight="600" fill="#2E74B5"><tspan x="2015" dy="0">7. similaritySearch(embedding, filters)</tspan></text><line x1="2220" y1="1180" x2="1810" y2="1180" stroke="#526173" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/><text x="2015" y="1168" text-anchor="middle" font-size="18" font-weight="600" fill="#526173"><tspan x="2015" dy="0">8. top-k chunks + metadata</tspan></text><line x1="1810" y1="1260" x2="2630" y2="1260" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrow)"/><text x="2220" y="1248" text-anchor="middle" font-size="18" font-weight="600" fill="#2E74B5"><tspan x="2220" dy="0">9. Prompt + chunks + guardrails</tspan></text><rect x="1740" y="1300" width="1040" height="110" rx="8" fill="#FDE9E7" stroke="#B42318" stroke-width="2"/><text x="1768" y="1335" text-anchor="start" font-size="18" font-weight="700" fill="#B42318"><tspan x="1768" dy="0">Nếu provider lỗi / hết quota:</tspan></text><text x="1768" y="1368" text-anchor="start" font-size="18" font-weight="400" fill="#182230"><tspan x="1768" dy="0">ghi nhận lỗi và thử provider dự phòng theo cấu hình.</tspan></text><line x1="2630" y1="1450" x2="1810" y2="1450" stroke="#526173" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/><text x="2220" y="1438" text-anchor="middle" font-size="18" font-weight="600" fill="#526173"><tspan x="2220" dy="0">10. answer + token usage</tspan></text><line x1="1810" y1="1590" x2="990" y2="1590" stroke="#526173" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/><text x="1400" y="1578" text-anchor="middle" font-size="18" font-weight="600" fill="#526173"><tspan x="1400" dy="0">11. Đáp án + citations + confidence</tspan></text><line x1="990" y1="1665" x2="1400" y2="1665" stroke="#2E74B5" stroke-width="3" marker-end="url(#arrow)"/><text x="1195" y="1653" text-anchor="middle" font-size="18" font-weight="600" fill="#2E74B5"><tspan x="1195" dy="0">12. Lưu message và AI usage event</tspan></text><line x1="990" y1="1740" x2="580" y2="1740" stroke="#1F7A5C" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/><text x="785" y="1728" text-anchor="middle" font-size="18" font-weight="600" fill="#1F7A5C"><tspan x="785" dy="0">13. 200 OK: answer + citations</tspan></text><text x="80" y="1810" text-anchor="start" font-size="18" font-weight="400" fill="#526173"><tspan x="80" dy="0">Nhánh mở rộng: nếu ngữ cảnh không đủ, API trả lời an toàn và đề nghị bổ sung tài liệu; phản hồi của người học được lưu riêng.</tspan></text>
</svg>