services:
  - type: web
    name: ezedu-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.ezedu-ai.mom
      - key: VITE_GOOGLE_CLIENT_ID
        value: 454115482184-r4o6majv0kmr6csov3eneqlr68ar2ig2.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: ezedu-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_WORKER
        value: "1"
      - key: DEMO_PASSWORD
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: '["https://ezedu-ai.mom","https://www.ezedu-ai.mom","https://ezedu.netlify.app"]'
      - key: FRONTEND_BASE_URL
        value: https://ezedu-ai.mom
      - key: ENABLE_EXAM_BLUEPRINT
        value: "true"
      - key: ENABLE_TIMED_EXAM
        value: "true"
      - key: ENABLE_CURRICULUM_KB
        value: "true"
      - key: PERSONALIZATION_ENABLED
        value: "true"
      - key: LEARNER_MODEL_ENABLED
        value: "true"
      - key: RECOMMENDATION_ENABLED
        value: "true"
      - key: AI_RECOMMENDATION_EXPLANATION_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: chuyende02
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_TEXT_PROVIDER
        value: claude
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: ANTHROPIC_FALLBACK_API_KEY
        value: ""
      - key: ANTHROPIC_FALLBACK_BASE_URL
        value: ""
      - key: ANTHROPIC_FALLBACK_MODEL
        value: ""
      - key: CLAUDE_FAST_MODEL
        value: ag/gemini-3.7-flash-low
      - key: CLAUDE_QUALITY_MODEL
        value: ag/gemini-3.7-flash-low
      - key: AI_TIMEOUT_SECONDS
        value: "45"
      - key: MAX_RETRIES
        value: "0"
      - key: CLAUDE_TOTAL_TOKEN_BUDGET
        value: "10000000"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /app/chroma_db
