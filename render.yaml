services:
  - type: web
    name: ezedu-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_WORKER
        value: "1"
      - key: DEMO_PASSWORD
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://ezedu.netlify.app
      - key: ENABLE_EXAM_BLUEPRINT
        value: "true"
      - key: ENABLE_TIMED_EXAM
        value: "true"
      - key: ENABLE_CURRICULUM_KB
        value: "true"
      - key: PERSONALIZATION_ENABLED
        value: "true"
      - key: LEARNER_MODEL_ENABLED
        value: "true"
      - key: RECOMMENDATION_ENABLED
        value: "true"
      - key: AI_RECOMMENDATION_EXPLANATION_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: chuyende02
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_TEXT_PROVIDER
        value: legacy
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: CLAUDE_FAST_MODEL
        sync: false
      - key: CLAUDE_QUALITY_MODEL
        sync: false
      - key: CLAUDE_TOTAL_TOKEN_BUDGET
        value: "10000000"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /app/chroma_db
